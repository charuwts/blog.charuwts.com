chapters:
  - title: Genesis 1 - CREATION
    position: 1
    description: God spoke; there was light and darkness, there was firmament and water, there was Earth, Seas, grass, herb and fruit, there was lights for seasons, two great lights and stars, there was creatures in the water and birds in the air, there was animals, and man. And God called it all good.
    image_url: https://blog.charuwts.com/bible_shapters/Genesis_001.png
    image_alt: Genesis Chapter 1 Summary
  - title: Genesis 2 - GARDEN
    position: 2
    description: God rested the seventh day. Thus God created the heavens and the earth. And man was made from dust and breathed to life by God. God planted a garden and put man there. There was a tree of life and a tree of the knowledge of good and evil. There was rivers. God commanded man not to eat of the tree of the knowledge of good and evil. Adam named the animals. Woman was formed from mans rib.
    image_url: https://blog.charuwts.com/bible_shapters/Genesis_002.png
  - title: Genesis 3 - REBELLION
    position: 3
    description: The serpent questions and twists Gods word about the tree of the knowledge of good and evil. The woman and her husband eat of it. They hear the Lord God walking in the garden and hide from Him. God questions their actions. The serpant is cursed, the womans pain in childbearing is multiplied. The ground is cursed for mans sake. God makes tunics of skin for Adam and his wife. God sends them out of the garden lest they eat of the tree of life. God places cherubim and a flaming sword in the garden.
    image_url: https://blog.charuwts.com/bible_shapters/Genesis_003.png
    image_alt: Genesis Chapter 3 Summary
